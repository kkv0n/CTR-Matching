options:
  platform: psx
  compiler: PSYQ
  basename: CrashTeamRacing
  target_path: ../230_Threads_MainMenu.bin
  base_path: ../split
  disassemble_all: true
  symbol_addrs_path:
    - ../syms/funcs_ovr_230.txt
    - ../syms/funcs_SCUS_94426.txt

# Threads overlays (230-233) are mutually exclusive: all load at 0x800AB9F0.
# Layout of each object: .rodata (name strings + pointer tables) -> .text -> .data
segments:
  - name: ovr_230
    type: code
    start: 0x0
    vram: 0x800ab9f0
    subsegments:
      - [0x0,      .rodata,  ovr_230_1]
      - [0xB8,     asm,      ovr_230_1]
      - [0x8AF4,   .data,    ovr_230_1]
      - [0xA058,   .rodata,  ovr_230_2]   # the object's name strings: SliceBuf, VlcBuf, RingBuf
      - [0xA074,   asm,      ovr_230_2]   # .text starts at the lui right after "RingBuf", not at 0xA07C
      - [0xADBC,   .data,    ovr_230_2]

  - [0xAE44]
