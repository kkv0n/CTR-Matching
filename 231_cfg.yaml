options:
  platform: psx
  compiler: PSYQ
  basename: CrashTeamRacing
  target_path: ../231_Threads_Racing.bin
  base_path: split
  disassemble_all: true
  symbol_addrs_path:
    - ../syms/funcs_ovr_231.txt
    - ../syms/funcs_SCUS_94426.txt

# This overlay is not [all the code][all the data]. They are 17 objects compiled
# separately and concatenated, each with the classic psyq order:
#
#        .rodata  ->  .text  ->  .data
#
# That is why at the junction of two objects two glued data blocks appear
# (the .data of the one that ends and the .rodata of the one that begins) that look like a single one.
# The cut is verified: the .rodata of each module begins with the string with
# the object name ("armadillo", "flamejet", "plant", "fireball"...), and those
# strings are referenced ONLY by the code that comes after.
#
# If they are not separated like this, splat disassembles the strings as if they were instructions
# and slaps them at the beginning of the following function.
segments:
  - name: main
    type: code
    start: 0x0
    vram: 0x800ab9f0
    subsegments:
      - [0x0,     .rodata, ovr_231_1]    # nitro, tnt1, shieldbomb, cloud1, shatter1, explosion1...
      - [0xC0,    asm,     ovr_231_1]
      - [0x6F6C,  .data,   ovr_231_1]
      - [0x771C,  .rodata, ovr_231_2]    # baron, drumbuddy
      - [0x7730,  asm,     ovr_231_2]
      - [0x7EEC,  .rodata, ovr_231_3]    # blade
      - [0x7F88,  asm,     ovr_231_3]
      - [0x81D0,  .data,   ovr_231_3]
      - [0x82CC,  .rodata, ovr_231_4]    # explosion1, crate, fruit_crate, crystal, startbanner
      - [0x838C,  asm,     ovr_231_4]
      - [0x9F78,  .data,   ovr_231_4]
      - [0x9F88,  .rodata, ovr_231_5]    # armadillo
      - [0xA184,  asm,     ovr_231_5]
      - [0xA554,  .rodata, ovr_231_6]    # fireball
      - [0xA560,  asm,     ovr_231_6]
      - [0xA954,  .data,   ovr_231_6]
      - [0xAABC,  .rodata, ovr_231_7]    # flamejet
      - [0xAAD0,  asm,     ovr_231_7]
      - [0xB0A4,  .data,   ovr_231_7]
      - [0xB35C,  .rodata, ovr_231_8]    # follower
      - [0xB420,  asm,     ovr_231_8]
      - [0xB674,  .rodata, ovr_231_9]    # fruit
      - [0xB67C,  asm,     ovr_231_9]
      - [0xB93C,  .rodata, ovr_231_10]
      - [0xBE24,  asm,     ovr_231_10]
      - [0xC130,  .data,   ovr_231_10]
      - [0xC194,  .rodata, ovr_231_11]
      - [0xC4C8,  asm,     ovr_231_11]
      - [0xC6F4,  .data,   ovr_231_11]
      - [0xC7F0,  .rodata, ovr_231_12]   # plant
      - [0xCB00,  asm,     ovr_231_12]
      - [0xD0DC,  .data,   ovr_231_12]
      - [0xD208,  .rodata, ovr_231_13]
      - [0xD42C,  asm,     ovr_231_13]
      - [0xD8B0,  .rodata, ovr_231_14]
      - [0xDB1C,  asm,     ovr_231_14]
      - [0xDBF4,  .rodata, ovr_231_15]   # spidershadow
      - [0xDE58,  asm,     ovr_231_15]
      - [0xE3B4,  .data,   ovr_231_15]
      - [0xE3F8,  .rodata, ovr_231_16]   # teeth
      - [0xE454,  asm,     ovr_231_16]
      - [0xE8C8,  .rodata, ovr_231_17]
      - [0xEA30,  asm,     ovr_231_17]

  - [0xEB58]
